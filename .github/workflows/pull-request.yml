---
jobs:
  run:
    env:
      SOURCE_REPO: https://codeberg.org/potatoenergy/potatoenergy.site
    runs-on: ubuntu-latest
    steps:
      - uses: superbrothers/close-pull-request@v3
        with:
          comment: "🚫 This repository does not accept pull requests.\n\nThis PR is being closed automatically. For contributions, please submit your pull request to:\n${{ env.SOURCE_REPO }}/pulls\n\nIf you have any questions, feel free to contact us there! 😊"
name: Close Pull Request
'on':
  pull_request_target:
    types: [opened]
outputs:
  home:
  - HTML
  - RSS
  - JSON
pagination:
  pagerSize: 7
params:
  EnableImageZoom: true
  EnableInstantClick: true
  ShowAllPagesInArchive: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowPageNums: true
  ShowPostNavLinks: true
  ShowReadingTime: true
  ShowRssButtonInSectionTermList: true
  ShowShareButtons: false
  ShowToc: true
  ShowWordCount: true
  TocOpen: true
  TocSide: right
  analytics:
    yandex:
      SiteVerificationTag: '94077410'
  assets:
    apple_touch_icon: apple-touch-icon.png
    disableHLJS: true
    favicon16x16: favicon-16x16.png
    favicon32x32: favicon-32x32.png
    favicon: favicon.ico
    webmanifest: site.webmanifest
  author: [ "Potato Energy" ]
  commentSystems:
    giscus:
      category: Comments
      category_id: DIC_kwDOPZG5xc4Ct1ai
      endpoint: https://giscus.app/client.js
      input_position: top
      languages_mapping:
        en-us: en
        ru-ru: ru
      lazy_loading: true
      mapping: og:title
      reactions: true
      repo: potatoenergy/potatoenergy.site
      repo_id: R_kgDOPZG5xQ
      strict_matching: true
      theme: preferred_color_scheme
  comments: true
  dateFormat: 02 Jan 2006
  defaultTheme: auto
  description: Potato Energy - Откройте для мира потенциал картофеля вместе с нами!
  disableThemeToggle: false
  fuseOpts:
    distance: 1000
    isCaseSensitive: false
    keys: [ "title", "permalink", "summary", "content" ]
    location: 0
    minMatchCharLength: 0
    shouldSort: true
    threshold: 0.4
  images: [ "images/papermod-cover.png" ]
  jsonld:
    Organization:
      '@context': https://schema.org
      '@type': Organization
      logo: https://potatoenergy.ru/img/icon.svg
      name: Potato Energy
      url: https://potatoenergy.ru/
  logo:
    icon: img/icon.svg
    iconHeight: 35
    text: Potato Energy
  social:
    fediverse_creator: '@ponfertato@social.potatoenergy.ru'
  title: Potato Energy
